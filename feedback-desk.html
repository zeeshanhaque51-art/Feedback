<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Desk — Influidity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00B9BB; --teal-deep:#00888A; --teal-soft:#E1F5F5; --teal-hair:#9DE0E1;
  --ink:#1C0B2A; --shell:#F4F4F3; --surface:#FFFFFF; --raised:#FAFAF9;
  --body:#5C5A63; --muted:#8F8C96; --border:#DEDDDA; --hair:#EDECEA;
  --amber:#8A5A00; --violet:#6A3FB0; --green:#0E7A55; --slate:#78757F; --red:#BF2C1E;
  --sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--ink);
  background:var(--shell);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{letter-spacing:-0.025em;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--teal-deep);text-decoration:none}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:none;border-color:var(--teal)!important;box-shadow:0 0 0 3px var(--teal-soft)!important;z-index:5;position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- micro type ---------- */
.eyebrow{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.micro{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
.sub{color:var(--body);font-size:12.5px}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:-0.01em;border:1px solid transparent;transition:background .14s,border-color .14s,opacity .14s;white-space:nowrap}
.btn .dot{width:7px;height:7px;border-radius:50%;flex:none}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink .dot{background:#fff}
.btn-ink:hover{background:#2c1442}
.btn-teal{background:var(--teal);color:var(--ink)}
.btn-teal .dot{background:var(--ink)}
.btn-teal:hover{background:#00a6a8}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink)}
.btn-ghost:hover{background:var(--raised);border-color:var(--muted)}
.btn-red{background:var(--red);color:#fff}.btn-red .dot{background:#fff}
.btn-sm{height:26px;padding:0 12px;font-size:11.5px}
.btn-lg{height:40px;padding:0 22px;font-size:13.5px}
.btn-full{width:100%}
.btn:disabled,.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn-ghost:disabled{background:var(--raised)}

/* ---------- chips / stamps ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:600;color:var(--body)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.chip .cnt{background:var(--teal-soft);color:var(--teal-deep);border-radius:999px;padding:0 6px;font-size:9.5px;font-weight:700}
.stamp{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;border:1px solid currentColor;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;background:transparent;white-space:nowrap}
.s-open,.s-awaiting{color:var(--amber)}
.s-progress,.s-received{color:var(--teal-deep)}
.s-revision{color:var(--violet)}
.s-done,.s-approved,.s-active{color:var(--green)}
.s-rejected,.s-archived,.s-paused{color:var(--slate)}
.s-clar,.s-high{color:var(--red)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--ink);height:52px;display:flex;align-items:center;gap:22px;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .bdot{width:11px;height:11px;border-radius:50%;background:var(--teal)}
.brand .bname{color:#fff;font-size:14px;font-weight:600;letter-spacing:-0.03em}
.brand .btag{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:rgba(255,255,255,.42)}
.tabs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:52px;padding:0 13px;color:rgba(255,255,255,.62);font-size:12.5px;font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.active{color:#fff;font-weight:600;border-bottom-color:var(--teal)}
.tab .tcnt{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.72)}
.tab.active .tcnt{background:var(--teal);color:var(--ink)}
.bar-right{display:flex;align-items:center;gap:8px;flex:none}
.tchip{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.86)}
.tchip:hover{background:rgba(255,255,255,.08)}
.tchip.live{border-color:var(--teal);color:var(--teal)}
.tchip .eid{font-family:var(--mono);font-size:10px;opacity:.5}

/* ---------- kpi band ---------- */
.kpi{position:sticky;top:52px;z-index:55;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-bottom:1px solid var(--border)}
.kpi-tile{text-align:left;padding:12px 20px;border-right:1px solid var(--hair);transition:background .14s}
.kpi-tile:last-child{border-right:none}
.kpi-tile:hover{background:var(--raised)}
.kpi-tile .kn{font-size:21px;font-weight:600;color:var(--teal-deep);letter-spacing:-0.03em;line-height:1.1}
.kpi-tile .kn.hot{color:var(--red)}
.kpi-tile .kl{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-top:3px}

/* ---------- layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 70px}
.page-head{margin-bottom:16px}
.page-head h1{font-size:18px;letter-spacing:-0.03em}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:9px}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--hair);background:var(--raised);border-radius:9px 9px 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{font-size:12.5px;font-weight:600}
.panel-body{padding:16px}
.grid2{display:grid;gap:16px;align-items:start}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%;height:34px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12.5px;transition:border-color .14s,box-shadow .14s}
textarea{height:auto;padding:9px 11px;line-height:1.5;resize:vertical}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='%238F8C96' stroke-width='1.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
input::placeholder,textarea::placeholder{color:#b6b3bb}
input:disabled,select:disabled,textarea:disabled{background:var(--raised);color:var(--muted);cursor:not-allowed}
.label-row{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.label-row .micro{margin:0}
.opt-tag{font-size:9.5px;color:var(--muted);text-transform:lowercase;letter-spacing:0}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
.err{font-size:11.5px;font-weight:600;color:var(--red);margin-top:8px;display:flex;gap:6px}
.err::before{content:'—'}
.inp-err{border-color:var(--red)!important}
.check{display:flex;align-items:center;gap:9px;font-size:12.5px}
.check input{width:15px;height:15px;accent-color:var(--teal-deep);flex:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tb-search{flex:1 1 200px;min-width:160px;max-width:320px}
.tb-search input{height:30px;border-radius:999px;padding:0 14px;font-size:12px}
.tb-sel{height:30px;border-radius:999px;padding:0 26px 0 13px;font-size:12px;width:auto;min-width:auto;background-color:var(--surface)}
.tb-sel.on{background-color:var(--ink);color:#fff;border-color:var(--ink);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.4' stroke-linecap='round'/></svg>")}
.tb-date{height:30px;border-radius:999px;font-size:11.5px;width:132px;font-family:var(--mono)}

/* ---------- tables ---------- */
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
.tbl thead th{position:sticky;top:117px;z-index:20;background:var(--raised);font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--hair);font-size:12.5px;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr:hover{background:#F6FBFB}
.tbl tbody tr.sel{background:var(--teal-soft)}
.tbl td.t{font-weight:600}
.tbl td .subline{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.cbx{width:15px;height:15px;accent-color:var(--teal-deep)}
.selbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:9px;padding:8px 14px;margin-bottom:10px;flex-wrap:wrap}
.selbar .n{font-size:12.5px;font-weight:600;margin-right:4px}
.selbar select{height:28px;border-radius:999px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#fff;font-size:11.5px;width:auto;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.4' stroke-linecap='round'/></svg>")}
.selbar .btn-ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.selbar .btn-ghost:hover{background:rgba(255,255,255,.1)}
.grouprow td{background:var(--raised);font-size:11px;font-weight:600;color:var(--body);letter-spacing:-0.01em;padding:8px 12px}
.cell-sel{border:1px solid transparent;background:transparent;height:26px;border-radius:6px;padding:0 22px 0 7px;font-size:11.5px;width:100%;background-position:right 6px center}
.cell-sel:hover{border-color:var(--border);background-color:var(--surface)}
.cell-inp{border:1px solid transparent;background:transparent;height:26px;padding:0 7px;font-size:11.5px;border-radius:6px;width:100%}
.cell-inp:hover{border-color:var(--border);background-color:var(--surface)}
.sel-stamp{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty{padding:40px 20px;text-align:center}
.empty b{display:block;font-size:15px;font-weight:600;letter-spacing:-0.02em;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--muted);max-width:340px;margin:0 auto 14px}
.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--hair),#f7f6f4,var(--hair));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- docket ---------- */
.docket{position:relative;background:var(--teal);color:var(--ink);border-radius:14px;padding:22px;animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.docket::after{content:'';position:absolute;left:0;right:0;top:calc(50% - 1px);height:0;pointer-events:none}
.docket .perf{height:1px;border-top:2px dotted rgba(28,11,42,.28);margin:16px -22px;position:relative}
.docket .perf::before,.docket .perf::after{content:'';position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--shell)}
.docket .perf::before{left:-9px}.docket .perf::after{right:-9px}
.dk-eyebrow{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.62}
.dk-id{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;margin-top:6px}
.dk-rule{width:60px;height:2.5px;background:var(--ink);margin:10px 0 16px}
.dk-dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px}
.dk-dl dt{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.62;padding-top:2px}
.dk-dl dd{font-weight:500}
.dk-copy{background:rgba(255,255,255,.34);border-radius:8px;padding:9px 11px;margin-top:9px}
.dk-copy .micro{color:rgba(28,11,42,.62);margin-bottom:4px}
.dk-copy .val{font-family:var(--mono);font-size:11px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.dk-copy .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dk-btn{height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(28,11,42,.3);font-size:10.5px;font-weight:600;flex:none;background:rgba(255,255,255,.5)}
.dk-btn:hover{background:#fff}
.dk-warn{font-size:12px;font-weight:700;color:#7a1a10;margin-top:14px;line-height:1.45}
.dk-actions{display:flex;gap:8px;margin-top:16px}
.dk-actions .btn{flex:1}
.dashed{border:1px dashed var(--border);border-radius:14px;padding:34px 24px;text-align:center;background:transparent}
.dashed b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}
.dashed p{font-size:12.5px;color:var(--muted);max-width:300px;margin:0 auto}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,11,42,.42);z-index:100;animation:fade .14s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:var(--shell);z-index:101;display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(28,11,42,.18);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.drawer-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 24px);max-height:calc(100% - 48px);background:var(--shell);border-radius:12px;z-index:101;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(28,11,42,.28);animation:pop .16s ease-out}
.modal.sm{width:440px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex:none}
.modal-head h3{font-size:14px}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{background:var(--surface);border-top:1px solid var(--border);padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;flex:none}
.x{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;line-height:1}
.x:hover{background:var(--hair);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:200;box-shadow:0 10px 30px rgba(28,11,42,.3);animation:lift .18s ease-out}
.toast.red{background:var(--red)}
@keyframes lift{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12.5px}
.dl dt{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);padding-top:2px}

/* ---------- misc blocks ---------- */
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.rmchip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:500}
.rmchip button{color:var(--muted);width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.rmchip button:hover{background:var(--red);color:#fff}
.spark{display:block}
.bar-track{height:7px;background:var(--hair);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--teal-deep);border-radius:999px}
.listrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--hair)}
.listrow:last-child{border-bottom:none}
.listrow .grow{flex:1;min-width:0}
.listrow .ttl{font-weight:600;font-size:12.5px;letter-spacing:-0.01em}
.listrow .meta{font-size:11px;color:var(--muted);margin-top:2px}
.minicard{border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:9px;padding:11px 13px;background:var(--surface)}
.copybox{background:var(--raised);border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:11px;word-break:break-all;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.vchain{display:flex;flex-direction:column;gap:0}
.vlink{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px}
.vlink:last-child{border-bottom:none}
.vnow{background:var(--teal-soft);margin:0 -16px;padding:9px 16px;border-bottom:1px solid var(--hair)}

/* ---------- sign in ---------- */
.signin{display:grid;grid-template-columns:52fr 48fr;min-height:100vh}
.si-left{background:var(--teal);color:var(--ink);padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.si-left h2{font-size:45px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;max-width:11ch}
.si-left .lead{font-size:15px;font-weight:500;color:rgba(28,11,42,.76);margin-top:16px;max-width:36ch;line-height:1.5}
.si-list{margin-top:30px}
.si-list li{list-style:none;font-size:12.5px;font-weight:500;padding:11px 0;border-top:1px solid rgba(28,11,42,.22)}
.si-right{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.si-form{width:100%;max-width:330px}
.si-form h1{font-size:23px;letter-spacing:-0.025em}
.foot-note{border-top:1px solid var(--hair);margin-top:20px;padding-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}
.sandbox{background:var(--raised);border:1px solid var(--hair);border-radius:9px;padding:12px;margin-top:16px}
.sandbox table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.sandbox td{padding:3px 0;color:var(--body)}
.sandbox td:first-child{color:var(--ink);font-weight:700;width:44px}

/* ---------- client-facing ---------- */
.cli{min-height:100vh;background:var(--shell);display:flex;flex-direction:column;align-items:center}
.cli-band{width:100%;background:var(--teal);color:var(--ink);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cli-inner{width:100%;max-width:520px;padding:20px 20px 60px}
.cli-hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cli-art{height:190px;background:linear-gradient(135deg,#1C0B2A,#00888A);display:flex;align-items:flex-end;justify-content:space-between;padding:14px;color:#fff}
.cli h2{font-size:22px;letter-spacing:-0.03em;line-height:1.25}
.cli p.big{font-size:15px;color:var(--body);line-height:1.5}
.rec{width:104px;height:104px;border-radius:50%;background:var(--teal);color:var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;border:none}
.rec.on{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,185,187,.55)}70%{box-shadow:0 0 0 26px rgba(0,185,187,0)}100%{box-shadow:0 0 0 0 rgba(0,185,187,0)}}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;margin-top:18px}
.wave i{width:3px;background:var(--teal-deep);border-radius:2px;animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:30px}}
.pt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.pt-idx{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);padding-top:9px}
.protostates{margin-top:26px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- component sheet ---------- */
.spec{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.spec .panel-body{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .grid2{grid-template-columns:1fr!important}
  .signin{grid-template-columns:1fr}
  .si-left{padding:26px}
  .si-left h2{font-size:32px}
  .si-list,.si-left .lead{display:none}
  .drawer{width:100%;top:auto;height:92vh;border-radius:14px 14px 0 0;animation:sheet .2s ease-out}
  @keyframes sheet{from{transform:translateY(30px)}to{transform:none}}
  .modal{width:calc(100% - 16px);border-radius:14px}
}
@media (max-width:760px){
  .topbar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px;position:static}
  .brand{order:1}.bar-right{order:2;margin-left:auto}
  .tabs{order:3;flex-basis:100%;border-top:1px solid rgba(255,255,255,.12)}
  .tab{height:42px;padding:0 11px}
  .kpi{grid-template-columns:1fr 1fr;position:static}
  .kpi-tile{border-bottom:1px solid var(--hair)}
  .kpi-tile:nth-child(2){border-right:none}
  .wrap{padding:16px 14px 60px}
  .tblwrap{border:none;background:transparent;border-radius:0}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tbody tr{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:9px;padding:6px 12px 8px}
  .tbl tbody tr.sel{border-color:var(--teal);background:var(--teal-soft)}
  .tbl td{border-bottom:1px solid var(--hair);padding:7px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .tbl td:last-child{border-bottom:none}
  .tbl td::before{content:attr(data-label);font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);flex:none}
  .tbl td.wide{display:block}
  .tbl td.wide::before{display:block;margin-bottom:4px}
  .tbl td.cbxcell{position:absolute;top:8px;right:10px;width:auto;border:none;padding:0}
  .tbl td.cbxcell::before{display:none}
  .tbl tbody tr.grouprow{background:var(--raised);border-color:var(--hair);padding:8px 12px}
  .tbl tr.grouprow td{border:none;padding:0;display:block}
  .tbl tr.grouprow td::before{display:none}
  .cell-sel,.cell-inp{border-color:var(--border);background:var(--surface);max-width:60%}
  .f-row{grid-template-columns:1fr}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tb-search{flex:none;width:190px}
  .dk-actions{flex-direction:column}
  .cli-inner{padding:16px 16px 50px}
}

function pageHead(title, sub, right){
  return `<div class="page-head head-row"><div><h1>${title}</h1><p>${sub}</p></div>${right||''}</div>`;

function selOpts(arr, cur, ph){
  return (ph?`<option value="">${ph}</option>`:'') + arr.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
}
function sparkline(vals, w, h){
  const max = Math.max(...vals), min = Math.min(...vals);
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/((max-min)||1))*(h-2)-1).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#00888A" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

/* ============ 03 COLLATERALS ============ */

/* ============ 05 TICKETS ============ */
function filteredTix(){
  const f = S.tFilter;
  let r = TICKETS.filter(t =>
    (!f.mine || t.who===S.user.name) &&
    (!f.client || coll(t.coll).client===f.client) && (!f.coll || t.coll===f.coll) &&
    (!f.who || t.who===f.who) && (!f.status || t.status===f.status) &&
    (!f.pri || t.pri===f.pri) && (!f.area || t.area===f.area));
  return r.sort((a,b)=>(b.pri==='High')-(a.pri==='High') || parseInt(b.age)-parseInt(a.age));
}
function tixRow(t){
  const c = coll(t.coll);
  return `<tr class="${S.tSel.includes(t.id)?'sel':''}">
    <td class="cbxcell"><input type="checkbox" class="cbx" data-tsel="${t.id}" ${S.tSel.includes(t.id)?'checked':''} aria-label="Select ${t.id}"></td>
    <td data-label="Ticket"><span class="mono" style="font-weight:600">${t.id}</span></td>
    <td data-label="Change requested" class="wide"><div style="font-weight:600">${esc(t.change)}</div>
      <div class="subline"><button class="mono" style="color:var(--teal-deep);font-weight:600" data-drawer="${t.coll}">${t.coll}</button> · ${esc(c.title)} · ${esc(t.src)} · logged by ${esc(t.logged)}</div></td>
    <td data-label="Area"><select class="cell-sel" data-edit="area:${t.id}">${selOpts(AREAS,t.area)}</select></td>

    <td data-label="Status"><select class="cell-sel sel-stamp" style="color:var(--${t.status==='Done'?'green':t.status==='Open'?'amber':t.status==='Needs clarification'?'red':t.status==='Rejected'?'slate':'teal-deep'})" data-edit="status:${t.id}">${selOpts(TIX_STATUS,t.status)}</select></td>

  </tr>`;
}
function scTickets(){
  const rows = filteredTix(), f = S.tFilter, on = v=>v?'on':'';
  let bodyRows;
  if(S.tGroup){

        + groups[id].map(tixRow).join('');

  } else bodyRows = rows.map(tixRow).join('');

  return shell('tickets', `

/* ============ RENDER + EVENTS ============ */
function render(){
  const r = $('#root');
  if(S.screen==='signin') r.innerHTML = scSignin();
  else if(S.screen==='client') r.innerHTML = scClient();
  else if(S.screen==='overview') r.innerHTML = scOverview();
  else if(S.screen==='send') r.innerHTML = scSend();
  else if(S.screen==='collaterals') r.innerHTML = scCollaterals();
  else if(S.screen==='tickets') r.innerHTML = scTickets();
  else if(S.screen==='clients') r.innerHTML = scClients();
  else if(S.screen==='settings') r.innerHTML = scSettings();
  else if(S.screen==='spec') r.innerHTML = scSpec();
  $('#overlay').innerHTML = S.drawer ? drawerHTML(S.drawer) : (S.overlay ? modalHTML(S.overlay) : '');
  document.body.style.overflow = (S.drawer||S.overlay) ? 'hidden' : '';
}
function go(s){ S.screen=s; S.drawer=null; S.overlay=null; window.scrollTo(0,0); render(); }
let toastTimer;
function toast(msg, red){
  $('#toastwrap').innerHTML = `<div class="toast ${red?'red':''}" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{$('#toastwrap').innerHTML='';}, 2600);
}
const SPLIT_RAW = 'make the logo bigger and change the tagline to sentence case and also remove the launch price';

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-open],[data-drawer],[data-kpi],[data-sel],[data-tsel],[data-cli]');
  if(!t) return;
  const d = t.dataset;

  if(d.sel!==undefined && t.tagName==='INPUT'){ e.stopPropagation();
    S.cSel = t.checked ? [...S.cSel,d.sel] : S.cSel.filter(x=>x!==d.sel); render(); return; }
  if(d.tsel!==undefined && t.tagName==='INPUT'){ e.stopPropagation();
    S.tSel = t.checked ? [...S.tSel,d.tsel] : S.tSel.filter(x=>x!==d.tsel); render(); return; }
  if(d.go){ go(d.go); return; }
  if(d.kpi!==undefined){ kpis()[+d.kpi].go(); return; }
  if(d.drawer){ e.stopPropagation(); S.overlay=null; S.drawer=d.drawer; render(); return; }
  if(d.open){ S.drawer=null; S.overlay=d.open;
    if(d.open==='split'){ S.splitLines=['Make the logo bigger','Set the tagline in sentence case','Remove the launch price']; S.splitRaw=SPLIT_RAW; }
    render(); return; }
  if(d.cli){ S.cliState=d.cli; render();
    if(d.cli==='processing') setTimeout(()=>{ if(S.cliState==='processing'){ S.cliState='review'; render(); } }, 1400);
    return; }

  switch(d.act){
    case 'close': S.drawer=null; S.overlay=null; S.ticketErr=false; render(); break;
    case 'signin': {
      const id = ($('#si-id')||{}).value, mail = ($('#si-mail')||{}).value;
      const p = PEOPLE.find(x=>x.id===String(id).trim());
      if(!id || !mail){ S.signinErr=true; render(); toast('Enter your employee ID and work email.',true); break; }
      if(!p || (mail && p.email!==mail.trim())){ S.signinErr=true; render(); break; }
      S.user=p; S.signinLoading=true; render();
      setTimeout(()=>{ S.signinLoading=false; S.signinErr=false; go('overview'); },450);
      break; }
    case 'signout': S.overlay=null; S.screen='signin'; S.signinErr=false; render(); break;
    case 'generate': {
      const cl = ($('#sd-client')||{}).value, ti = ($('#sd-title')||{}).value, ty=($('#sd-type')||{}).value, rv=($('#sd-rev')||{}).value;
      if(!cl){ toast('Pick a client first.',true); break; }
      const name = cl.split(' · ')[0], pre = cl.split(' · ')[1];
      const title = ti || 'Launch teaser — hoarding';
      const revises = rv && rv!=='Not a revision' ? rv.split(' · ')[0] : null;
      const id = `${pre}-0416`;
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const link = `https://script.google.com/macros/s/AKfy…/exec?c=${id}&t=k7m2pq4z`;
      const contact = (cliOf(name)||{}).contact || 'Approver';
      S.docket = { id, client:name, title, type:ty, ver:revises?2:1, revises, by:S.user.name, bid:S.user.id, sent:'26 Aug 26',
        file:`${id}_${slug}_v${revises?2:1}`, link,
        msg:`Hi ${contact} — ${name},\nSharing for your review — ${title} (${ty}). Ref: ${id}.\nPlease put your feedback on this link. It is tied to this exact piece, so nothing gets mixed up:\n${link}\n— ${S.user.name}, Influidity` };
      render(); toast(`${id} registered`); break; }
    case 'clear-docket': S.docket=null; S.docketWarn=false; S.docketNoNumber=false; render(); break;
    case 'tog-warn': S.docketWarn=!S.docketWarn; render(); break;
    case 'tog-nonum': S.docketNoNumber=!S.docketNoNumber; render(); break;
    case 'copy': navigator.clipboard && navigator.clipboard.writeText(d.val); toast('Link copied'); break;
    case 'whatsapp': toast('Opening WhatsApp…'); break;
    case 'nudge': toast(`Nudge drafted for ${d.id}`); break;
    case 'openclient': S.drawer=null; S.cliState='idle'; go('client'); break;
    case 'clear-c': S.cFilter={q:'',client:'',status:'',type:'',by:''}; S.cEmpty=false; render(); break;
    case 'tog-empty': S.cEmpty=!S.cEmpty; render(); break;
    case 'clear-sel': S.cSel=[]; render(); break;
    case 'bulk-apply': {
      const v = ($('#bulk-status')||{}).value;
      if(!v){ toast('Pick a status first.',true); break; }
      const risky = S.cSel.some(id=>openTix(id).length>0);
      if(v==='Approved' && risky){ S.overlay='confirm'; render(); break; }
      S.cSel.forEach(id=>{ coll(id).status=v; }); const n=S.cSel.length; S.cSel=[]; render(); toast(`${n} set to ${v}`); break; }
    case 'approve-anyway': S.cSel.forEach(id=>{coll(id).status='Approved';}); { const n=S.cSel.length; S.cSel=[]; S.overlay=null; render(); toast(`${n} approved`);} break;
    case 'tog-mine': S.tFilter.mine=!S.tFilter.mine; render(); break;
    case 'tog-group': S.tGroup=!S.tGroup; render(); break;
    case 'clear-t': S.tFilter={mine:false,client:'',coll:'',who:'',status:'',pri:'',area:''}; render(); break;
    case 'clear-tsel': S.tSel=[]; render(); break;
    case 'tix-done': S.tSel.forEach(id=>{TICKETS.find(t=>t.id===id).status='Done';}); { const n=S.tSel.length; S.tSel=[]; render(); toast(`${n} marked done`);} break;
    case 'markdone': TICKETS.find(t=>t.id===d.id).status='Done'; render(); toast('1 marked done'); break;
    case 'save-ticket': {
      const c = ($('#mt-coll')||{}).value, txt = (($('#mt-change')||{}).value||'').trim();
      if(!c){ S.ticketErr=true; render(); break; }
      if(txt.split(/\s+/).filter(Boolean).length>15){
        S.splitRaw = txt;
        S.splitLines = txt.split(/\s+and\s+(?:also\s+)?/i).map(x=>x.trim()).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1));
        S.overlay='split'; render(); break; }
      S.overlay=null; S.ticketErr=false; render(); toast('T-0013 added'); break; }
    case 'split-rm': S.splitLines.splice(+d.i,1); render(); break;
    case 'split-add': S.splitLines.push(''); render(); break;
    case 'save-split': { const n=S.splitLines.length; S.overlay=null; go('tickets'); toast(`${n} tickets added`); break; }
    case 'save-client': S.overlay=null; render(); toast('Client saved'); break;
    case 'reset': S.overlay=null; S.screen='signin'; render(); toast('Demo data reset'); break;
    case 'tog-mode': S.mode = S.mode==='Demo data' ? 'Live · Sheets' : 'Demo data'; render(); break;
    case 'become-admin': S.user=PEOPLE[1]; render(); break;
    case 'become-member': S.user=PEOPLE[2]; go('settings'); break;
    case 'contact-admin': toast('Message drafted to Jitendra #022'); break;
    case 'saved': toast('Saved'); break;
    case 'demo-toast': toast('VUM-0416 registered'); break;
  }
});

document.addEventListener('change', e => {
  const f = e.target.dataset.filter, ed = e.target.dataset.edit;
  if(e.target.id==='sd-client'){
    const name = (e.target.value||'').split(' \u00b7 ')[0];
    const live = COLLATERALS.filter(c=>c.client===name && c.status!=='Archived');
    const sel = $('#sd-rev'); if(sel){
      if(live.length){ sel.disabled=false; sel.innerHTML = '<option>Not a revision</option>'+live.map(c=>`<option>${c.id} \u00b7 v${c.ver} \u00b7 ${esc(c.title)}</option>`).join(''); }
      else { sel.disabled=true; sel.innerHTML = '<option>Nothing to revise yet</option>'; }
    }
  }
  if(f){ const [k,key]=f.split(':'); (k==='c'?S.cFilter:S.tFilter)[key]=e.target.value; if(k==='c') S.cEmpty=false; render(); }
  if(ed){ const [field,id]=ed.split(':'); const t=TICKETS.find(x=>x.id===id); if(t){ t[field]=e.target.value; render(); toast(`${id} updated`);} }
});
document.addEventListener('input', e => {
  if(e.target.dataset.filter==='c:q'){ S.cFilter.q=e.target.value; S.cEmpty=false;
    const v=e.target.value, sel=e.target.selectionStart; render();
    const n=document.querySelector('[data-filter="c:q"]'); if(n){ n.focus(); n.setSelectionRange(sel,sel); } }
  if(e.target.id==='mt-change'){ const n=e.target.value.trim().split(/\s+/).filter(Boolean).length;
    const c=$('#mt-count'); if(c){ c.textContent=n+'/15'; c.style.color = n>15?'var(--amber)':'var(--muted)'; } }
  if(e.target.dataset.split!==undefined){ S.splitLines[+e.target.dataset.split]=e.target.value; }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && (S.drawer||S.overlay)){ S.drawer=null; S.overlay=null; render(); } });

render();
</script></body></html>
